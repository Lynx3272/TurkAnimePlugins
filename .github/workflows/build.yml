name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE/builds/"*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set repository name
        run: echo "GITHUB_REPOSITORY=Lynx3272/TurkAnimePlugins" >> "$GITHUB_ENV"
      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          export GITHUB_REPOSITORY="Lynx3272/TurkAnimePlugins"
          chmod +x gradlew
          ./gradlew make makePluginsJson

          find . -type f -name "*.cs3" -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          sed -i "s#https://github.com/user/repo#https://github.com/Lynx3272/TurkAnimePlugins#g; s#https://raw.githubusercontent.com/user/repo/builds/TurkAnime.cs3#https://raw.githubusercontent.com/Lynx3272/TurkAnimePlugins/builds/TurkAnime.cs3#g" "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
